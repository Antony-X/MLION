<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MLion hero (dev)</title>
  <meta name="theme-color" content="#0b0a08">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geologica:wght,SHRP@300..800,0..100&display=swap" rel="stylesheet">
  <style>
    /* A stand-in for the home page, just enough to drive js/hero3d.js. */
    :root {
      --bg: #0b0a08; --surface: #161411; --raised: #211e1a; --ink: #f2ede4; --muted: #a39b90;
      --gold: #f2b53c; --gold-ink: #1a1306;
      --t-baseline: #857f76; --t-overfit: #a59a88; --t-indist: #c4ae88;
      --t-outlier: #dfbf7e; --t-longtail: #f5d999; --t-mlion: #f2b53c;
      --side: 16px;
      color-scheme: dark;
    }
    @media (min-width: 760px) { :root { --side: 32px; } }
    @media (min-width: 1200px) { :root { --side: 48px; } }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg); color: var(--ink);
      font: 17px/1.5 "Geologica", ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased; overflow-x: hidden;
    }
    h1, h2, p, ol, ul { margin: 0; }
    .glyph { width: 1em; height: 1em; flex: none; overflow: visible; color: var(--tc); }
    .glyph.g-mlion { width: 1.12em; height: 1.12em; margin: -0.06em; }
    .mark { color: var(--gold); overflow: visible; }
    .mk-face { stroke: var(--bg); }
    .mk-eye { fill: var(--bg); }

    /* the canvas sticks behind the hero and the depth list, then scrolls away:
       a track spans the section and the canvas sticks inside it */
    .descent { position: relative; }
    .track { position: absolute; inset: 0; }
    #hero3d { position: sticky; top: 0; display: block; width: 100%; height: 100vh; height: 100svh; }
    .hero, .depths-sec { position: relative; padding: 0 var(--side); }

    .hero { min-height: 100vh; min-height: 100svh; padding-top: 6svh; }
    .brandmark { display: flex; align-items: center; gap: 0.2em; font-size: clamp(60px, 16.5vw, 200px); }
    .brandmark .mark { width: 1.02em; height: 1.02em; }
    .wordmark { font-size: 1em; font-stretch: 125%; font-weight: 300; line-height: 0.9; letter-spacing: -0.045em; white-space: nowrap; }
    .pitch { margin-top: 28px; font-size: clamp(20px, 1.1vw + 14px, 28px); line-height: 1.3; letter-spacing: -0.01em; max-width: 24ch; }
    .cta { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 16px 24px; }
    .btn {
      display: inline-flex; align-items: center; min-height: 60px; padding: 0 32px; border-radius: 999px;
      font-size: 19px; font-weight: 600; text-decoration: none; background: var(--raised); color: var(--ink);
    }
    .btn.primary { background: var(--gold); color: var(--gold-ink); }

    /* six depths: one row per tier, lit as the ball reaches its depth */
    .depths-sec { padding-top: 12svh; padding-bottom: 60svh; max-width: 620px; }
    .depths-sec h2 { font-size: clamp(28px, 1.6vw + 18px, 42px); font-weight: 400; letter-spacing: -0.015em; }
    .depths { list-style: none; padding: 0; }
    .depths li {
      display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px;
      min-height: 24svh; margin-left: calc(var(--d) * 24%);
      color: var(--tc); opacity: calc(0.32 * var(--fade, 1)); transition: opacity 320ms ease;
      text-shadow: 0 0 14px var(--bg), 0 0 4px var(--bg);
    }
    .depths li.past { opacity: calc(0.62 * var(--fade, 1)); }
    .depths li.on { opacity: 1; }
    .depths .glyph { font-size: 30px; }
    .depths .n { font-size: 21px; letter-spacing: -0.01em; }
    .depths .n small { display: block; color: var(--muted); font-size: 14px; letter-spacing: 0; }
    .depths .p { color: var(--muted); }
    .depths .t-mlion .n, .depths .t-mlion .p { color: var(--gold); }

    .more { position: relative; background: var(--bg); padding: 72px var(--side) 120px; }
    .more h2 { font-size: clamp(28px, 1.6vw + 18px, 42px); font-weight: 400; margin-bottom: 20px; }
    .more ul { list-style: none; padding: 0; max-width: 620px; }
    .more a { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 0; font-size: 24px; color: inherit; text-decoration: none; }
    .more a span { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <div class="descent">
    <div class="track"><canvas id="hero3d" aria-hidden="true"></canvas></div>
    <header class="hero">
      <div class="brandmark"><span id="mark"></span><h1 class="wordmark">MLion</h1></div>
      <p class="pitch">A daily machine-learning word game. Rarer answers roll deeper.</p>
      <div class="cta"><a class="btn primary" href="#">Start training</a><a class="btn" href="#">Play with friends</a></div>
    </header>
    <section class="depths-sec">
      <h2>Six depths</h2>
      <ol class="depths" id="depths" aria-label="Rarity tiers"></ol>
    </section>
  </div>
  <section class="more">
    <h2>More</h2>
    <ul>
      <li><a href="#">Unlimited<span>Endless runs</span></a></li>
      <li><a href="#">Quiz<span>Four answers, one fits</span></a></li>
      <li><a href="#">Leaderboard<span>Today's top scores</span></a></li>
      <li><a href="#">Stats<span></span></a></li>
    </ul>
  </section>

  <script src="../js/landscape.js"></script>
  <script src="../js/hero3d.js"></script>
  <script>
    (function () {
      const V = window.MLION_VISUALS;
      const TIERS = [
        ["baseline", "Baseline", 10, "The answer everyone blurts out."],
        ["overfit", "Overfit", 15, "The famous obscure pick."],
        ["indist", "In-Distribution", 30, "Right in the fat middle."],
        ["outlier", "Outlier", 60, "Genuinely uncommon."],
        ["longtail", "Long Tail", 85, "Few sample this far out."],
        ["mlion", "One in a MLion", 100, "The global minimum."],
      ];
      document.getElementById("mark").outerHTML = V.mark("hero-mark");
      const list = document.getElementById("depths");
      list.innerHTML = TIERS.map(([id, name, pts, blurb], i) =>
        `<li class="t-${id}" style="--d:${(i / 5).toFixed(2)}">${V.glyph(id)}<span class="n">${name}<small>${blurb}</small></span><span class="p">+${pts}</span></li>`).join("");
      const rows = Array.from(list.children);

      // Scroll drives progress piecewise, so each row reaches the reading line
      // just as the ball reaches its depth, and the ball has settled in the
      // minimum by the time the list has been read.
      let xs = [0, 1], ts = [0, 1];
      function anchors() {
        // a phone reads in the lower third, under the basin; a wide screen beside it
        const phone = innerWidth < 760;
        const line = innerHeight * (phone ? 0.8 : 0.56);
        const ys = rows.map((r) => { const b = r.getBoundingClientRect(); return b.top + scrollY + b.height / 2 - line; });
        xs = [0].concat(ys.slice(1), [ys[5] + innerHeight * (phone ? 0.12 : 0.3)]);
        ts = [0].concat(MLionHero.stages.slice(1), [1]);
      }
      function progress() {
        const y = scrollY;
        if (y <= xs[0]) return 0;
        for (let i = 1; i < xs.length; i++) if (y < xs[i]) return ts[i - 1] + (ts[i] - ts[i - 1]) * (y - xs[i - 1]) / (xs[i] - xs[i - 1]);
        return 1;
      }
      // on a phone the basin sits above the reading line: rows already read
      // fade as they rise into it
      function fadeRows() {
        const phone = innerWidth < 760;
        for (const r of rows) {
          const y = r.getBoundingClientRect().top / innerHeight;
          r.style.setProperty("--fade", phone ? Math.max(0, Math.min(1, (y - 0.45) / 0.2)).toFixed(2) : 1);
        }
      }
      anchors(); fadeRows();
      addEventListener("resize", () => { anchors(); fadeRows(); });
      addEventListener("scroll", fadeRows, { passive: true });
      window.hero = MLionHero.mount(document.getElementById("hero3d"), {
        progress,
        onStage(i) { rows.forEach((r, k) => { r.classList.toggle("on", k === i); r.classList.toggle("past", k < i); }); },
      });
      window.heroAnchors = () => ({ xs, ts });
    })();
  </script>
</body>
</html>
