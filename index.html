<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MLion · the daily descent</title>
  <meta name="description" content="A daily machine-learning word game. Seven prompts, 25 seconds each. Rarer answers roll deeper. One in a MLion.">
  <meta name="theme-color" content="#0b0a08">
  <meta property="og:title" content="MLion · the daily descent">
  <meta property="og:description" content="A daily ML word game. Rarer answers roll deeper.">
  <meta property="og:image" content="https://antony-x.github.io/MLION/img/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="MLion: a daily machine-learning word game">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://antony-x.github.io/MLION/img/og.png">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MLion">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,300..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=iiwlo5">
</head>
<body>
  <canvas id="landscape" aria-hidden="true"></canvas>

  <header class="topbar">
    <button class="brand" id="brand" aria-label="MLion home"><svg class="mark" viewBox="-32 -32 64 64" aria-hidden="true" focusable="false"><path class="mk-curve" d="M-20.71 13.44C-20.71 -0.08 -17.59 -10.48 -11.35 -16.72C-7.19 -20.88 -1.99 -22.44 2.69 -22.44C11.53 -22.44 17.77 -15.16 16.21 -5.28C14.97 2.52 10.49 9.8 13.09 15.52C15.17 20.2 21.41 20.72 24.01 16.04" fill="none" stroke="currentColor" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round"/><circle class="mk-ball" cx="-20.71" cy="19.16" r="6.1" fill="currentColor"/></svg><span>MLion</span></button>
    <div class="topbar-mid" id="topbar-mid"></div>
    <button class="icon-btn chat-btn" id="chat-btn" aria-label="Room chat" aria-expanded="false" aria-controls="chat" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 11.5a8 8 0 0 1-11.8 7L3.5 20l1.5-4.9a8 8 0 1 1 15.5-3.6z"/></svg>
      <span class="chat-badge" id="chat-badge" hidden></span>
    </button>
    <button class="icon-btn" id="menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="drawer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 9h14M5 15h14"/></svg>
    </button>
  </header>

  <main id="app" aria-live="off"><p class="boot" aria-hidden="true"><span></span></p></main>
  <script>
    /* A first visit draws the home hero at once instead of a spinner while the questions download.
       app.js then swaps in the full home without replaying the entrance, so keep this markup in step
       with renderHome() in js/app.js (tests/preboot.e2e.js compares the two). */
    (function () {
      var calm = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
      try {
        if (!/^#?\/?(home)?$/.test(location.hash)) return;
        for (var i = 0; i < localStorage.length; i++) if (/^mlion:(records|run:)/.test(localStorage.key(i))) return;
        var st = JSON.parse(localStorage.getItem("mlion:settings") || "{}");
        if (typeof st.reducedMotion === "boolean") calm = st.reducedMotion;
      } catch (e) { return; }
      var mark = document.querySelector("#brand svg").outerHTML.replace('class="mark"', 'class="mark hero-mark"');
      document.body.dataset.view = "home";
      document.getElementById("app").innerHTML = '<section class="screen pre-home"><i hidden></i>' +
        '<div class="home-hero' + (calm ? "" : " arrive") + '"><div class="brandmark">' + mark +
        '<h1 class="wordmark" aria-label="MLion"><span class="line"><span>MLion</span></span></h1></div>' +
        '<p class="pitch">A daily machine-learning word game. Rarer answers roll deeper.</p>' +
        '<div class="hero-cta"><a class="btn primary big" href="#daily">Start training</a><a class="btn big" href="#live">Play with friends</a></div>' +
        '</div></section>';
    })();
  </script>

  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <nav class="drawer" id="drawer" aria-hidden="true" aria-label="Menu">
    <div class="drawer-head">
      <span class="brand" aria-hidden="true">MLion</span>
      <button class="icon-btn" id="drawer-close" aria-label="Close menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <a class="nav" href="#daily">Today</a>
    <a class="nav" href="#live">Play with friends</a>
    <a class="nav" href="#unlimited">Unlimited</a>
    <a class="nav" href="#quiz">Quiz</a>
    <a class="nav" href="#sprint">Sprint</a>
    <a class="nav" href="#board">Leaderboard</a>
    <a class="nav" href="#stats">Stats</a>
    <a class="nav" href="#how">How to play</a>
    <a class="nav" href="#prefs">Settings</a>
    <button class="nav install" id="install" type="button" hidden>Install the app</button>
    <div class="drawer-acct" id="drawer-acct" hidden></div>
    <p class="foot">One in a MLion.</p>
  </nav>

  <div id="modal"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <section class="chat" id="chat" aria-label="Room chat" hidden>
    <div class="chat-head"><b>Chat</b><button class="icon-btn" id="chat-close" aria-label="Close chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ol class="chat-log" id="chat-log" aria-live="polite"></ol>
    <p class="chat-note" id="chat-note" role="status"></p>
    <form class="chat-form" id="chat-form" autocomplete="off">
      <input class="chat-input" id="chat-input" maxlength="200" autocomplete="off" enterkeyhint="send" aria-label="Message" placeholder="Say something">
      <button class="btn primary" id="chat-send" type="submit">Send</button>
    </form>
  </section>
  <button class="chat-peek" id="chat-peek" type="button" hidden></button>

  <noscript><p style="position:relative;z-index:2;text-align:center;padding:40px">MLion needs JavaScript to run.</p></noscript>
  <script src="js/engine.js?v=v7ccyv"></script>
  <script src="js/data.js?v=8qvr70"></script>
  <script src="js/landscape.js?v=1wh6xx"></script>
  <script src="js/hero3d.js?v=1qqfzi9"></script>
  <script src="js/app.js?v=16m9vt8"></script>
</body>
</html>
