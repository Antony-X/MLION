<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MLion · the daily descent</title>
  <meta name="description" content="A daily machine-learning word game. Seven prompts, 25 seconds each. Rarer answers roll deeper. One in a MLion.">
  <meta name="theme-color" content="#0b0a08">
  <meta property="og:title" content="MLion · the daily descent">
  <meta property="og:description" content="A daily ML word game. Rarer answers roll deeper.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-32 -32 64 64'%3E%3Cpath d='M0 -30L6.6 -22.5L16.2 -25.2L17.8 -15.4L27.3 -12.5L23.3 -3.3L29.7 4.3L21.4 9.8L22.7 19.6L12.7 19.8L8.5 28.8L0 23.5L-8.5 28.8L-12.7 19.8L-22.7 19.6L-21.4 9.8L-29.7 4.3L-23.3 -3.3L-27.3 -12.5L-17.8 -15.4L-16.2 -25.2L-6.6 -22.5Z' fill='%23f2b53c' stroke='%23f2b53c' stroke-width='3' stroke-linejoin='round'/%3E%3Cpath d='M-15.5 -8.5H15.5L0 16Z' fill='none' stroke='%230b0a08' stroke-width='5.5' stroke-linejoin='round'/%3E%3Ccircle cx='-5.2' cy='-1.6' r='2.3' fill='%230b0a08'/%3E%3Ccircle cx='5.2' cy='-1.6' r='2.3' fill='%230b0a08'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,300..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=xrdriv">
</head>
<body>
  <canvas id="landscape" aria-hidden="true"></canvas>

  <header class="topbar">
    <button class="brand" id="brand" aria-label="MLion home"><svg class="mark" viewBox="-32 -32 64 64" aria-hidden="true" focusable="false"><path class="mk-mane" d="M0 -30L6.6 -22.5L16.2 -25.2L17.8 -15.4L27.3 -12.5L23.3 -3.3L29.7 4.3L21.4 9.8L22.7 19.6L12.7 19.8L8.5 28.8L0 23.5L-8.5 28.8L-12.7 19.8L-22.7 19.6L-21.4 9.8L-29.7 4.3L-23.3 -3.3L-27.3 -12.5L-17.8 -15.4L-16.2 -25.2L-6.6 -22.5Z" fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path class="mk-face" d="M-15.5 -8.5H15.5L0 16Z" fill="none" stroke-width="5.5" stroke-linejoin="round"/><circle class="mk-eye" cx="-5.2" cy="-1.6" r="2.3"/><circle class="mk-eye" cx="5.2" cy="-1.6" r="2.3"/></svg><span>MLion</span></button>
    <div class="topbar-mid" id="topbar-mid"></div>
    <button class="icon-btn chat-btn" id="chat-btn" aria-label="Room chat" aria-expanded="false" aria-controls="chat" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 11.5a8 8 0 0 1-11.8 7L3.5 20l1.5-4.9a8 8 0 1 1 15.5-3.6z"/></svg>
      <span class="chat-badge" id="chat-badge" hidden></span>
    </button>
    <button class="icon-btn" id="menu-btn" aria-label="Open menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 9h14M5 15h14"/></svg>
    </button>
  </header>

  <main id="app" aria-live="off"></main>

  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <nav class="drawer" id="drawer" aria-hidden="true" aria-label="Menu">
    <div class="drawer-head">
      <span class="brand" aria-hidden="true">MLion</span>
      <button class="icon-btn" id="drawer-close" aria-label="Close menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <a class="nav" href="#daily">Today</a>
    <a class="nav" href="#live">Live match</a>
    <a class="nav" href="#rooms">Public rooms</a>
    <a class="nav" href="#challenge">Challenge a friend</a>
    <a class="nav" href="#unlimited">Unlimited</a>
    <a class="nav" href="#quiz">Quiz</a>
    <a class="nav" href="#packs">Packs</a>
    <a class="nav" href="#board">Leaderboard</a>
    <a class="nav" href="#archive">Archive</a>
    <a class="nav" href="#library">Library</a>
    <a class="nav" href="#stats">Stats</a>
    <a class="nav" href="#how">How to play</a>
    <a class="nav" href="#faq">FAQ</a>
    <a class="nav" href="#prefs">Settings</a>
    <p class="foot">One in a MLion. <a href="https://github.com/Antony-X/MLION" target="_blank" rel="noopener">Source and answer sets</a></p>
  </nav>

  <div id="modal"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <section class="chat" id="chat" aria-label="Room chat" hidden>
    <div class="chat-head"><b>Chat</b><button class="icon-btn" id="chat-close" aria-label="Close chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ol class="chat-log" id="chat-log" aria-live="polite"></ol>
    <p class="chat-note" id="chat-note" role="status"></p>
    <form class="chat-form" id="chat-form" autocomplete="off">
      <input class="chat-input" id="chat-input" maxlength="200" autocomplete="off" enterkeyhint="send" aria-label="Message" placeholder="Say something">
      <button class="btn primary" id="chat-send" type="submit">Send</button>
    </form>
  </section>
  <button class="chat-peek" id="chat-peek" type="button" hidden></button>

  <noscript><p style="position:relative;z-index:2;text-align:center;padding:40px">MLion needs JavaScript to run.</p></noscript>
  <script src="js/engine.js?v=163akdh"></script>
  <script src="js/data.js?v=hz0g88"></script>
  <script src="js/landscape.js?v=z2b1pn"></script>
  <script src="js/app.js?v=cpu6zw"></script>
</body>
</html>
