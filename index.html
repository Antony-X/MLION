  <!-- What the page may load and talk to. tools/build.js writes the sha256 of each inline script into script-src;
       connect-src: the Supabase project, the live-room relay, and the reserved test host the e2e mocks answer.
       GitHub Pages can't send headers, so frame-ancestors (ignored in a meta tag) is done by the script below. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-nfnGaNZKFJ22IQbJPPzgKnd4wHe6eqjSIphxlvEOYTo=' 'sha256-Xfukbjw8KGbfR5vtMADfFEujTQ4O8h3PEklQrSL2TOw=' 'sha256-64Ki0cnuiPL36PTwW2NKmUkNaxnfSIRTxhMRkRyq7hg=' 'sha256-pfTd1jnlGfGG7aOw7/zSOTz5yBlbYhpfcSM+Qu7XxTE='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' wss://mlion.lol wss://www.mlion.lol https://ozqnznvxxxnefeetidwq.supabase.co wss://public.cloud.shiftr.io https://mock.supabase.test; worker-src 'self'; manifest-src 'self'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>
    /* 1. Not inside someone else's frame (clickjacking): hide, and step out to the top if allowed.
       2. Boot watchdog: if the game throws before it starts (damaged saved data, a half-loaded page), offer a
          way out instead of a blank screen. js/app.js sets window.MLION_BOOTED when it is up. */
    (function () {
      if (window.top !== window.self) {
        document.documentElement.style.display = "none";
        try { window.top.location.replace(window.location.href); } catch (e) { /* sandboxed: stay hidden */ }
        return;
      }
      var failed = false, loaded = false;
      function show() {
        if (!failed || !loaded || window.MLION_BOOTED) return;
        var app = document.getElementById("app");
        if (!app) return;
        app.innerHTML = '<section class="screen narrow boot-fail"><div class="page-head"><h1>MLion couldn’t start</h1>' +
          '<p>The page may have loaded only in part, or something saved in this browser is damaged.</p></div>' +
          '<div class="btn-row"><button class="btn primary" id="bf-reload" type="button">Reload</button>' +
          '<button class="btn" id="bf-repair" type="button">Repair saved data</button></div>' +
          '<p class="muted small">Repair keeps a copy of what this browser saved, clears it (settings too) and reloads. Your name and login stay.</p></section>';
        document.getElementById("bf-reload").addEventListener("click", function () { location.reload(); });
        document.getElementById("bf-repair").addEventListener("click", function () {
          try {
            var copy = {}, drop = [];
            for (var i = 0; i < localStorage.length; i++) {
              var k = localStorage.key(i);
              if (k.indexOf("mlion:") !== 0) continue;
              copy[k] = localStorage.getItem(k);
              if (k !== "mlion:name" && k !== "mlion:reset" && k.indexOf("mlion:sb") !== 0) drop.push(k);
            }
            localStorage.setItem("mlion-backup", JSON.stringify({ at: new Date().toISOString(), keys: copy }));
            drop.forEach(function (k) { localStorage.removeItem(k); });
          } catch (e) { /* storage blocked: a reload is all that's left */ }
          location.replace(location.pathname + "#home");
          location.reload();
        });
      }
      window.addEventListener("error", function () { if (!window.MLION_BOOTED) { failed = true; show(); } });
      window.addEventListener("load", function () { loaded = true; show(); });
    })();
  </script>

  <!-- the leaderboard and settings project: open the connection while the game's scripts download -->
  <link rel="preconnect" href="https://ozqnznvxxxnefeetidwq.supabase.co" crossorigin>
  <script>
    /* A link straight to a leaderboard (#board, #board-quiz, #board-YYYY-MM-DD): start reading it now, while the game's
       scripts download. js/app.js takes this request over only if it asks for exactly the same URL (boardFetch), so keep
       the project URL and key in step with BOARD_CONFIG there (tests/board.e2e.js checks). Tests inject their own project. */
    (function () {
      try {
        var m = /^#board(-quiz)?(?:-(\d{4}-\d{2}-\d{2}))?$/.exec(location.hash);
        var c = window.MLION_BOARD || (navigator.webdriver ? null : { url: "https://ozqnznvxxxnefeetidwq.supabase.co", key: "sb_publishable_xztj1Nx4sRbgltpd0u3XWg_2cASIAG5" });
        if (!m || !c || !window.fetch || !window.AbortController || window.top !== window.self || !/^https?:$/.test(location.protocol)) return;
        var d = new Date(), p = function (n) { return (n < 10 ? "0" : "") + n; };
        var day = m[2] || d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
        var q = m[1] ? ["daily_quiz_scores", "marks,tenths", "score.desc,tenths.asc,created_at.asc"] : ["daily_scores", "tiers", "score.desc,created_at.asc"];
        var url = c.url + "/rest/v1/" + q[0] + "?select=user_id,score," + q[1] + ",created_at,profiles(name)&day=eq." + day + "&order=" + q[2] + "&limit=100";
        var ctl = new AbortController(), res = fetch(url, { headers: { apikey: c.key }, signal: ctl.signal });
        setTimeout(function () { ctl.abort(); }, 10000);
        res.catch(function () { /* app.js reports it if it takes this request over */ });
        window.MLION_BOARD_EARLY = { url: url, res: res };
      } catch (e) { /* the game reads the board itself */ }
    })();
  </script>

  <main id="app" aria-live="off"><p class="boot" aria-hidden="true"><span></span></p></main>
  <script>
    /* A first visit draws the home hero at once instead of a spinner while the questions download.
       app.js then swaps in the full home without replaying the entrance, so keep this markup in step
       with renderHome() in js/app.js (tests/preboot.e2e.js compares the two). */
    (function () {
      var calm = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
      try {
        if (!/^#?\/?(home)?$/.test(location.hash)) return;
        for (var i = 0; i < localStorage.length; i++) if (/^mlion:(records|run:)/.test(localStorage.key(i))) return;
        var st = JSON.parse(localStorage.getItem("mlion:settings") || "{}");
        if (typeof st.reducedMotion === "boolean") calm = st.reducedMotion;
      } catch (e) { return; }
      var mark = document.querySelector("#brand svg").outerHTML.replace('class="mark"', 'class="mark hero-mark"');
      document.body.dataset.view = "home";
      document.getElementById("app").innerHTML = '<section class="screen pre-home"><i hidden></i>' +
        '<div class="home-hero' + (calm ? "" : " arrive") + '"><div class="brandmark">' + mark +
        '<h1 class="wordmark" aria-label="MLion"><span class="line"><span><span class="ml">ML</span>ion</span></span></h1></div>' +
        '<p class="pitch">Name the <em class="rare">rarest</em> answer you can to a machine learning question.</p>' +
        '<div class="hero-cta"><a class="btn primary big" href="#daily">Play today\'s daily</a><a class="btn big" href="#live">Play with friends</a></div>' +
        '</div></section>';
    })();
  </script>
